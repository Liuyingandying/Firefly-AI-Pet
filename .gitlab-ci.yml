# Firefly AI Pet — GitLab CI
#
# 背景：本项目为 PySide6 桌面应用（非 Web 服务），Auto DevOps 的
# buildpack 流水线不适用（pipeline #631 build/test 失败的根因）。
# 本文件以显式定义替换 Auto DevOps，在 headless Linux 上运行
# Linux 稳定测试集（与 GitHub Actions 等价 + Provider Manager 状态层）。
#
# 密钥提示：本流水线不需要任何 API Key；tests/conftest.py 会
# 自动阻断未 stub 的外部 HTTP 请求，防止意外外呼。

workflow:
  rules:
    # 默认分支（firefly-main）推送 + 指向默认分支的 Merge Request
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test

variables:
  # PySide6 在 headless Linux 上必须使用离屏显示后端
  QT_QPA_PLATFORM: "offscreen"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.12-slim-bookworm
  before_script:
    # Acquire::Retries 限制 apt 单源重试，避免 runner 网络下
    # trixie 源索引反复重试刷爆 4MB 日志上限（pipeline #633 教训）
    - apt-get update -o Acquire::Retries=3
    - apt-get install -y --no-install-recommends
      libegl1
      libgl1
      libglib2.0-0
      libxkbcommon0
      libdbus-1-3
      libfontconfig1
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt pytest
  script:
    - pytest tests/test_provider_router.py tests/test_pagelens_ai_bridge.py tests/test_provider_manager.py -q
